# appearance = "system" # or "dark" / "light"
theme_light = "catppuccin-latte"
# theme_dark = "catppuccin-latte"

diff_view = "unified" # unified" | "side-by-side"

ignore_whitespace = false # ignore all whitespace in local VCS diffs

mouse = true
leader = ","                    # configurable prefix for leader shortcuts
comment_vim = true              # vim modal editing in the review comment box
review_watch_interval_ms = 1000 # set to 0 to disable persisted-review polling

comment_types = [
  { id = "annotation", label = "Annotation", definition = "annotate the code", color = "yellow" },
]
