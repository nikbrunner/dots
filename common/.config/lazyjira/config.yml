# https://github.com/textfuel/lazyjira/blob/main/docs/Config.md
gui:
  theme: default
  sidePanelWidth: 125
  statusIcons:
    Backlog: "💤"
    Open: "📬"
    In Progress: "⚡"
    Resolved: "✅"
    Done: "✅"
    Closed: "❌"
  issueListFields:
    - key
    - type
    - status
    - priority
    - summary

issueTabs:
  - name: WIP
    jql: assignee = currentUser() AND status = "In Progress" ORDER BY updated DESC
  - name: Today
    jql: assignee = currentUser() AND updated >= startOfDay() ORDER BY updated DESC
  - name: Yesterday
    jql: assignee = currentUser() AND updated >= startOfDay(-1) AND updated < startOfDay() ORDER BY updated DESC
  - name: Last 7 Days
    jql: assignee = currentUser() AND updated >= startOfDay(-6) ORDER BY updated DESC
    maxResults: 100
  - name: Done This Week
    jql: assignee = currentUser() AND statusCategory = Done AND resolutiondate >= -7d ORDER BY resolutiondate DESC
  - name: WEBSDK
    jql: project = WEBSDK AND assignee=currentUser() AND (statusCategory != Done OR resolutiondate >= -7d) ORDER BY statusCategory ASC, resolutiondate DESC, status ASC, priority ASC, updated ASC
  - name: Cloud Platform
    jql: project = CP AND assignee=currentUser() AND (statusCategory != Done OR resolutiondate >= -7d) ORDER BY statusCategory ASC, resolutiondate DESC, status ASC, priority ASC, updated ASC
  # currently disabled because I have no issues here
  # - name: Labels Server
  #   jql: project = LS AND assignee=currentUser() AND (statusCategory != Done OR resolutiondate >= -7d) ORDER BY statusCategory ASC, resolutiondate DESC, status ASC, priority ASC, updated ASC
  - name: Created
    jql: reporter = currentUser() ORDER BY created DESC
    maxResults: 20
  - name: No Parent
    jql: reporter = currentUser() AND parent IS EMPTY AND issuetype != Epic AND statusCategory != Done ORDER BY created ASC
  - name: No Epic
    jql: reporter = currentUser() AND "Epic Link" IS EMPTY AND issuetype != Epic AND statusCategory != Done ORDER BY created ASC
  - name: No Component
    jql: reporter = currentUser() AND component IS EMPTY AND statusCategory != Done ORDER BY created ASC
  - name: No Sprint
    jql: reporter = currentUser() AND sprint IS EMPTY AND status != Backlog AND statusCategory != Done ORDER BY created ASC
  - name: No Priority
    jql: reporter = currentUser() AND priority = "Default" AND statusCategory != Done ORDER BY created ASC
  - name: Stale
    jql: assignee = currentUser() AND statusCategory != Done AND updated <= -14d ORDER BY updated ASC

fields:
  - id: status
  - id: priority
  - id: assignee
  - id: reporter
  - id: issuetype
  - id: sprint
  - id: labels
  - id: components
  - id: duedate
    name: "Due Date"
    type: text

customCommands:
  - key: "ctrl+y"
    name: "Copy as markdown link"
    command: |
      s=$(printf %s {{.Summary | shellescape}} | tr -d '[]')
      link=$(printf '[%s %s](%s/browse/%s)' {{.Key | shellescape}} "$s" {{.JiraHost | shellescape}} {{.Key | shellescape}})
      printf '%s' "$link" | (command -v pbcopy >/dev/null && pbcopy || wl-copy)
      command -v herdr >/dev/null && herdr notification show "Copied markdown link" --body "$link" --sound done
    suspend: false
  - key: "y"
    name: "Copy key + summary"
    command: |
      s=$(printf %s {{.Summary | shellescape}} | tr -d '[]')
      out=$(printf '%s %s' {{.Key | shellescape}} "$s")
      printf '%s' "$out" | (command -v pbcopy >/dev/null && pbcopy || wl-copy)
      command -v herdr >/dev/null && herdr notification show "Copied key + summary" --body "$out" --sound done
    suspend: false
  - key: "b"
    name: "Copy as branch name"
    command: |
      key=$(printf %s {{.Key | shellescape}} | tr '[:upper:]' '[:lower:]')
      slug=$(printf %s {{.Summary | shellescape}} | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
      out=$(printf '%s-%s' "$key" "$slug" | cut -c1-50 | sed -E 's/-+$//')
      printf '%s' "$out" | (command -v pbcopy >/dev/null && pbcopy || wl-copy)
      command -v herdr >/dev/null && herdr notification show "Copied branch name" --body "$out" --sound done
    suspend: false
