root = "~/repos"

[providers."github.com"]
preset = "github"
prefix = ""
remote_actions = ["create", "rename", "archive", "visibility", "delete"]

[[repositories]]
url = "git@github.com:nikbrunner/dots"

[[repositories]]
url = "git@github.com:nikbrunner/notes"

[[repositories]]
url = "git@github.com:nikbrunner/koyo"

[[repositories]]
url = "git@github.com:nikbrunner/nbr.haus"

[[repositories]]
url = "git@github.com:nikbrunner/fff-snacks.nvim"

[[repositories]]
url = "git@github.com:nikbrunner/flux.nvim"

[[repositories]]
url = "git@github.com:nikbrunner/mdn.nvim"

[[repositories]]
url = "git@github.com:nikbrunner/agents"
post_clone = "./install.sh"

[[repositories]]
url = "git@github.com:nikbrunner/lazyjira"
post_clone = "lazyjira-sync"

[[repositories]]
url = "git@github.com:black-atom-industries/helm.tmux"
post_clone = "make install"

[[repositories]]
url = "git@github.com:black-atom-industries/shiplog"
post_clone = "deno task install"

[[repositories]]
url = "git@github.com:nikbrunner/bm"
post_clone = "make install"

[[repositories]]
url = "git@github.com:nikbrunner/tmux-file-picker"
post_clone = "make install"

[[repositories]]
url = "git@github.com:black-atom-industries/.github"
post_clone = "./install.sh"

[[repositories]]
url = "git@github.com:black-atom-industries/*"

[[repositories]]
url = "git@github.com:nikbrunner/lager.git"

[[repositories]]
url = "git@github.com:ImFusionGmbH/Website.git"

[[repositories]]
url = "git@github.com:nikbrunner/writing.git"

[session]
host = "rex"

[session.layouts.default]
focus = "Agents"

[session.layouts.default.tabs.Agents]
order = 1
root = { pane = "Agent I" }
splits = [{ source = "Agent I", pane = "Agent II", direction = "right" }]

[session.layouts.default.tabs.Edit]
order = 2
root = { pane = "Editor" }

[session.layouts.default.tabs.Shells]
order = 3
root = { pane = "Shell I" }
splits = [
  { source = "Shell I", pane = "Shell II", direction = "right" },
  { source = "Shell I", pane = "Shell III", direction = "down" },
  { source = "Shell II", pane = "Shell IV", direction = "down" },
]
