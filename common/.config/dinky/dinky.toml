#:schema https://dinky.rodeo/schemas/dinky.json
# ~/.config/dinky/dinky.toml. Saved changes take effect at once.
# A key you leave out keeps the value shown here.
# Every key and command: https://dinky.rodeo/configuration/

start-at-login = true
workspaces = 5                          # across all displays, one native Space each
default-layout = 'tiles'                # tiles (dwindle) | dwindle | accordion | fixed
default-tiling = true                   # false leaves workspaces untiled unless overridden
follow-app-activation = true            # Cmd-Tab and Dock clicks switch Spaces the fast way
float-windows-without-fullscreen = true # progress windows, About, Calculator and the like float

[accordion]
padding = 50         # points the neighbours peek out by
orientation = 'auto' # auto: run along the container's longer side | keep

[gaps]
inner = 16 # or { horizontal = 8, vertical = 8 }
outer = { top = 64, bottom = 32, left = 32, right = 32 } # top: bar height plus the gap

# Display patterns: main, secondary, or part of a name as `dinky list-displays` prints it.
# A workspace lives on the first display its patterns match, else on the main display.
# [workspace-to-display]
# 5 = 'secondary'

# Overrides for one display.
# [display.main]
# gaps.outer.top = 44

# The notch already keeps windows below the bar on the built-in display.
[display.built-in]
gaps.outer.top = 32

[borders]
enabled = true
width = 4
active-color = '#fd4200'          # '#rrggbb' or '#rrggbbaa'
inactive-color = '#dbe1ff'
order = 'below'                   # below | above (a click-through ring over the window)
exclude-apps = ['com.brnbw.Tuna'] # bundle IDs whose windows get no border

[focus-follows-mouse]
enabled = false
delay-ms = 100         # how long the pointer rests on a window before it takes focus
accordion-edges = true # resting on a peeking accordion edge focuses that window

[animations]
enabled = true    # windows glide to their tiles; off while Reduce Motion is on
duration-ms = 150 # roughly how long a window takes to arrive

[drag]
placeholders = true # outline where a dragged tile came from and the tile it will swap with

# dinky commands run on events. exec-and-forget gets $DINKY_WORKSPACE, $DINKY_PREV_WORKSPACE, $DINKY_DISPLAY,
# and $DINKY_MODE, $DINKY_PREV_MODE in mode-changed.
[hooks]
startup = ['exec-and-forget brew services restart sketchybar']
workspace-changing = [
  'exec-and-forget sketchybar --trigger dinky_workspace_changing DINKY_DISPLAY=$DINKY_DISPLAY DINKY_WORKSPACE=$DINKY_WORKSPACE',
]
workspace-changed = [
  'exec-and-forget sketchybar --trigger dinky_workspace_changed',
]
focus-changed = ['exec-and-forget sketchybar --trigger dinky_focus_changed']
mode-changed = [
  'exec-and-forget sketchybar --trigger dinky_mode_changed MODE=$DINKY_MODE',
]

# Every rule whose conditions all match a new window runs, in order.
[[rules]]
app-id = 'com.apple.systempreferences' # also: app-name, title (regexes), kind (normal|dialog|sheet|panel)
run = 'layout floating'

[[rules]]
app-id = 'cc.ffitch.shottr'
run = 'layout floating'

[[rules]]
app-id = 'com.brnbw.Tuna'
run = 'layout floating'

# Workspace 3: Notes
[[rules]]
app-id = 'md.obsidian'             # Obsidian
run = 'move-window-to-workspace 3'

[[rules]]
app-id = 'com.apple.Notes'         # Notes
run = 'move-window-to-workspace 3'

# Workspace 4: Media
[[rules]]
app-id = 'com.apple.Music'         # Music
run = 'move-window-to-workspace 4'

[[rules]]
app-id = 'net.imput.helium.app.cinhimbnkkaeohfgghhklpknlkffjgod' # YouTube Music (Helium web app)
run = 'move-window-to-workspace 4'

# Workspace 5: Social
[[rules]]
app-id = 'Mattermost.Desktop'      # Mattermost
run = 'move-window-to-workspace 5'

[[rules]]
app-id = 'org.whispersystems.signal-desktop' # Signal
run = 'move-window-to-workspace 5'

[[rules]]
app-id = 'net.whatsapp.WhatsApp'   # WhatsApp
run = 'move-window-to-workspace 5'

[[rules]]
app-id = 'com.hnc.Discord'         # Discord
run = 'move-window-to-workspace 5'

[[rules]]
app-id = 'com.apple.MobileSMS'     # Messages
run = 'move-window-to-workspace 5'

[mode.main]
cmd-left = 'workspace prev'
cmd-right = 'workspace next'

cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'

cmd-shift-1 = 'move-window-to-workspace 1'
cmd-shift-2 = 'move-window-to-workspace 2'
cmd-shift-3 = 'move-window-to-workspace 3'
cmd-shift-4 = 'move-window-to-workspace 4'
cmd-shift-5 = 'move-window-to-workspace 5'
cmd-shift-6 = 'move-window-to-workspace 6'
cmd-shift-7 = 'move-window-to-workspace 7'
cmd-shift-8 = 'move-window-to-workspace 8'
cmd-shift-9 = 'move-window-to-workspace 9'

cmd-o = 'workspace-back-and-forth'
ctrl-alt-cmd-shift-r = 'exec-and-forget $HOME/.local/bin/dinky-windows'
ctrl-alt-cmd-shift-w = 'exec-and-forget $HOME/.local/bin/dinky-focus-app net.imput.helium'
ctrl-alt-cmd-shift-space = 'exec-and-forget $HOME/.local/bin/dinky-focus-app com.mitchellh.ghostty'

cmd-h = 'focus left'
cmd-j = 'focus down'
cmd-k = 'focus up'
cmd-l = 'focus right'
cmd-shift-h = 'move left'
cmd-shift-j = 'move down'
cmd-shift-k = 'move up'
cmd-shift-l = 'move right'

cmd-f = 'fullscreen'

cmd-shift-semicolon = 'mode service'
cmd-semicolon = 'mode layout'

[mode.service]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
cmd-shift-h = ['join-with left', 'mode main']
cmd-shift-j = ['join-with down', 'mode main']
cmd-shift-k = ['join-with up', 'mode main']
cmd-shift-l = ['join-with right', 'mode main']

[mode.layout]
esc = 'mode main'
t = [
  'layout tiles',
  'exec-and-forget $HOME/.config/sketchybar/plugins/dinky_layout_set.sh tiles',
  'mode main',
]
a = [
  'layout accordion',
  'exec-and-forget $HOME/.config/sketchybar/plugins/dinky_layout_set.sh accordion',
  'mode main',
]
s = [
  'layout scrolling',
  'exec-and-forget $HOME/.config/sketchybar/plugins/dinky_layout_set.sh scrolling',
  'mode main',
]
f = ['layout floating tiling', 'mode main']
r = ['layout horizontal vertical', 'mode main']
b = ['balance-sizes', 'mode main']
m = ['fullscreen', 'mode main']
equal = 'mode resize'

# Stays active so resizes repeat; esc or enter goes back.
[mode.resize]
minus = 'resize smart -50'
equal = 'resize smart +50'
shift-equal = 'resize smart +2000'
esc = 'mode main'
enter = 'mode main'
