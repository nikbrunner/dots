onboarding = false
# https://github.com/ogulcancelik/herdr
# https://herdr.dev/docs/configuration/
# https://herdr.dev/docs/config-reference/
# https://herdr.dev/plugins/

# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — Minium ∷ Sienna Dark
# Generated by Black Atom Industries — https://github.com/black-atom-industries/black-atom
[theme.custom]
accent = "#ef9369"
panel_bg = "#26201f"
sidebar_bg = "#26201f"
active_row_bg = "#2e2726"
selection_bg = "#4a4342"
surface_dim = "#2e2726"
surface0 = "#3a3333"
surface1 = "#2e2726"
overlay0 = "#857f7a"
overlay1 = "#ef9369"
text = "#d9ccba"
subtext0 = "#857f7a"
red = "#f47a7d"
green = "#a9ba78"
yellow = "#d6b174"
blue = "#79b5cc"
teal = "#80babd"
mauve = "#c9a0ba"
peach = "#a5896f"
# END BLACK ATOM LIVERY THEME

[ui.sidebar.spaces]
row_gap = 1
rows = [["state_icon", { token = "workspace", bold = true }], ["branch", "git_status"]]

[ui.sidebar.agents]
row_gap = 1
rows = [
    [
        { token = "$parent", bold = true, dim = false },
    ],
    [
        { token = "$branch", dim = true },
    ],
    [
        { token = "$worktree", dim = true },
    ],
    [
        "terminal_title_stripped",
    ],
    [
        "state_icon",
        "state_text",
        "agent",
    ],
]

[update]
channel = "preview"

[ui.toast]
delivery = "herdr"

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = false
sidebar_width = 35
sidebar_collapsed_mode = "hidden"
pane_borders = "always"
pane_scrollbars = false

tab_bar_right = [
    # { type = "zoom" },
    { type = "command", command = "~/.config/herdr/status.sh", interval_seconds = 1, timeout_seconds = 2 },
    { type = "command", command = '[ "$(~/.config/herdr/tab-width.sh)" -ge 120 ] || exit 0; command -v scutil >/dev/null || exit 0; n=$(scutil --nc list | grep "^\* (Connected)" | grep " VPN (" | sed -E "s/.*\"([^\"]*)\".*/\1/;s/ +$//" | paste -sd, -); echo "󰖂 ${n:-off}⠀"', interval_seconds = 5, timeout_seconds = 2 },
    { type = "command", command = '[ "$(~/.config/herdr/tab-width.sh)" -ge 120 ] || exit 0; b=$(pmset -g batt 2>/dev/null) || exit 0; p=$(echo "$b" | grep -Eo "[0-9]+%") || exit 0; case $b in *"AC Power"*) i=󰂄 ;; *) i=󰁹 ;; esac; echo "$i ${p}⠀"', interval_seconds = 5, timeout_seconds = 2 },
    { type = "datetime", format = "\uf073 %A %d.%m.⠀" },
    { type = "datetime", format = "\uf017 %H:%M" },
    # { type = "text", text = "prod" },
]
tab_bar_right_separator = " "

status_indicators = "symbols"
[ui.sound]
enabled = false
done_path = "./sounds/277033__headphaze__ui-completed-status-alert-notification-sfx001.mp3"
request_path = "./sounds/337050__shinephoenixstormcrow__215415__unfa__ping_modified.mp3"

[session]
resume_agents_on_restore = true

[experimental]
pane_history = true
kitty_graphics = true

switch_ascii_input_source_in_prefix = true
[keys]
prefix = "ctrl+,"

# General
open_notification_target = "prefix+,"
copy_mode = "alt+esc"
toggle_sidebar = "cmd+s"

# Tabs
switch_tab = "alt+1..9"
rename_tab = "alt+n"
new_tab = "alt+t"
previous_tab = "alt+h"
next_tab = "alt+l"
close_tab = "alt+q"
move_tab_previous = "alt+shift+h"
move_tab_next = "alt+shift+l"

# Workspaces
switch_workspace = "alt+shift+1..9"
previous_workspace = "alt+k"
next_workspace = "alt+j"
new_workspace = "alt+shift+t"
close_workspace = "alt+shift+q"
rename_workspace = "alt+shift+n"

# Worktrees
new_worktree = "alt+ctrl+t"
open_worktree = "alt+ctrl+o"
remove_worktree = "alt+ctrl+d"

# Agents
focus_agent = "ctrl+alt+1..9"
previous_agent = "alt+ctrl+k"
next_agent = "alt+ctrl+j"

# Panes
close_pane = "alt+x"
last_pane = "alt+o"
zoom = "alt+z"

# Navigation
navigate_workspace_up = "k"
navigate_workspace_down = "j"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-nvim-nav.left"
description = "navigate left (nvim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-nvim-nav.down"
description = "navigate down (nvim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-nvim-nav.up"
description = "navigate up (nvim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-nvim-nav.right"
description = "navigate right (nvim/herdr)"

[[keys.command]]
description = "Font picker"
key = "alt+shift+f"
type = "popup"
command = "pick-font"
width = "50%"
height = "50%"

[[keys.command]]
description = "Bookmarks"
key = "alt+shift+w"
type = "popup"
command = "bm"
width = "50%"
height = "35%"

[[keys.command]]
description = "Pick a file"
key = "alt+shift+p"
type = "popup"
command = "file-picker -g"
width = "95%"
height = "80%"

[[keys.command]]
description = "Open LazyGit"
key = "alt+g"
type = "popup"
command = "lazygit"
width = "100%"
height = "100%"

[[keys.command]]
description = "Github"
key = "alt+shift+g"
type = "popup"
command = "glab-tui"
width = "95%"
height = "80%"

[[keys.command]]
description = "Github (dev)"
key = "alt+ctrl+g"
type = "popup"
command = "~/repos/nikbrunner/glab-tui/target/release/glab-tui"
width = "95%"
height = "80%"

[[keys.command]]
description = "Open LazyDocker"
key = "alt+shift+d"
type = "popup"
command = "lazydocker"
width = "80%"
height = "80%"

[[keys.command]]
description = "Open LazyJira"
key = "alt+shift+j"
type = "popup"
command = "lazyjira"
width = "100%"
height = "100%"

[[keys.command]]
description = "Open Tuicr"
key = "alt+r"
type = "popup"
command = "tuicr -w"
width = "100%"
height = "100%"

[[keys.command]]
description = "Open Livery"
key = "prefix+l"
type = "popup"
command = "livery apply"
width = 65
height = 15

[[keys.command]]
key = "alt+s"
type = "popup"
command = "helm-herdr"
description = "Open Helm"
width = 200
height = 35

[[keys.command]]
key = "alt+shift+s"
type = "plugin_action"
command = "helm-herdr.open-side"
description = "helm side pane"

[[keys.command]]
key = "alt+shift+o"
type = "plugin_action"
command = "helm-herdr.jump-back"
description = "jump to previous workspace"

[[keys.command]]
key = "prefix+b"
type = "popup"
command = "sh -c 'herdr agent attach \"$(herdr agent list | jq -r \".result.agents[] | select(.terminal_title_stripped // \\\"\\\" | ascii_downcase == \\\"bob\\\") | .pane_id\" | head -1)\"'"
description = "open Bob (ctrl+b q closes)"
width = "80%"
height = "80%"
