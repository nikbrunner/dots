[ui.toast]
delivery = "herdr"

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = false

# https://herdr.dev/docs/configuration/#sidebar-row-layouts
[ui.sidebar.agents]
row_gap = 0
rows = [
  [
    "state_icon",
    "workspace",
    "agent",
  ],
  [
    { token = "terminal_title_stripped", dim = true },
  ],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true },
  ],
  [
    "branch",
    "git_status",
  ],
]


[session]
resume_agents_on_restore = true

[experimental]
pane_history = true
kitty_graphics = true

switch_ascii_input_source_in_prefix = true
[keys]
prefix = "ctrl+a"

switch_tab = "alt+1..9"
switch_workspace = "alt+shift+1..9"
focus_agent = "ctrl+alt+1..9"

copy_mode = "alt+esc"

open_notification_target = "prefix+,"

close_pane = "alt+x"
last_pane = "alt+o"

rename_tab = "alt+n"
new_tab = "alt+t"
previous_tab = "alt+h"
next_tab = "alt+l"
close_tab = "alt+q"

previous_workspace = "alt+k"
next_workspace = "alt+j"
new_workspace = "alt+shift+t"
close_workspace = "alt+shift+q"
rename_workspace = "alt+shift+n"

new_worktree = "alt+ctrl+t"
open_worktree = "alt+ctrl+o"
remove_worktree = "alt+ctrl+d"

previous_agent = "alt+ctrl+k"
next_agent = "alt+ctrl+j"

zoom = "alt+z"

navigate_workspace_up = "k"
navigate_workspace_down = "j"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-nvim-nav.left"
description = "navigate left (nvim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-nvim-nav.down"
description = "navigate down (nvim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-nvim-nav.up"
description = "navigate up (nvim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-nvim-nav.right"
description = "navigate right (nvim/herdr)"

[[keys.command]]
key = "alt+shift+f"
type = "pane"
command = "pick-font"
description = "Pick a font"

[[keys.command]]
key = "alt+shift+p"
type = "pane"
command = "herdr-file-picker -g"
description = "Pick a file"

[[keys.command]]
key = "alt+shift+g"
type = "pane"
command = "lazygit"
description = "Open LazyGit"

[[keys.command]]
key = "alt+shift+d"
type = "pane"
command = "lazydocker"
description = "Open LazyDocker"

[[keys.command]]
key = "alt+shift+j"
type = "pane"
command = "lazyjira"
description = "Open LazyJira"

[[keys.command]]
key = "alt+shift+r"
type = "pane"
command = "tuicr -w"
description = "Open Tuicr"

[[keys.command]]
key = "ctrl+shift+t"
type = "pane"
command = "tuxedo"
description = "Open Tasks"

[[keys.command]]
key = "alt+s"
type = "plugin_action"
command = "helm-herdr.open"
description = "jump to anything"

[[keys.command]]
key = "alt+p"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "alt+shift+o"
type = "plugin_action"
command = "helm-herdr.jump-back"
description = "jump to previous workspace"

[[keys.command]]
key = "cmd+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
