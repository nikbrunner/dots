onboarding = false
# https://github.com/ogulcancelik/herdr
# https://herdr.dev/docs/configuration/
# https://herdr.dev/plugins/

# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — JPN ∷ Koyo Hiru
# Generated by Black Atom Industries — https://github.com/black-atom-industries/herdr
[theme.custom]
accent = "#ed9a00"
panel_bg = "#f8e7d0"
surface_dim = "#f8e7d0"
surface0 = "#fff5e5"
surface1 = "#fff5e5"
overlay0 = "#b19b7c"
overlay1 = "#d1ba9b"
text = "#3a2e3b"
subtext0 = "#b19b7c"
red = "#f5345e"
green = "#3aa85b"
yellow = "#ed9a00"
blue = "#9e77dc"
teal = "#00ab93"
mauve = "#f88f4f"
peach = "#f1771e"


[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#ed9a00" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#ed9a00" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME

[update]
channel = "preview"

[ui.toast]
delivery = "herdr"

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = false

