# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — PAPER ∷ Blue Dark
# Generated by Black Atom Industries — https://github.com/black-atom-industries/herdr
[theme]
name = "catppuccin"

[theme.custom]
accent = "#fa8f19"
panel_bg = "#08173f"
surface_dim = "#08173f"
surface0 = "#1e305b"
surface1 = "#253763"
overlay0 = "#8098ca"
overlay1 = "#6379aa"
text = "#ebf2ff"
subtext0 = "#8098ca"
red = "#9eb7eb"
green = "#8098ca"
yellow = "#8098ca"
blue = "#9eb7eb"
teal = "#9eb7eb"
mauve = "#8098ca"
peach = "#8098ca"
# END BLACK ATOM LIVERY THEME

[update]
channel = "preview"

