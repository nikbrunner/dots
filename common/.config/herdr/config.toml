onboarding = false
# https://github.com/ogulcancelik/herdr
# https://herdr.dev/docs/configuration/
# https://herdr.dev/docs/config-reference/
# https://herdr.dev/plugins/

# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — Facility ∷ Dimmed Dark
# Generated by Black Atom Industries — https://github.com/black-atom-industries/black-atom
[theme.custom]
accent = "#e7fc7c"
panel_bg = "#131717"
sidebar_bg = "#e7fc7c"
active_row_bg = "#cfe271"
selection_bg = "#bed06a"
surface_dim = "#1c2020"
surface0 = "#242a2a"
surface1 = "#1c2020"
overlay0 = "#627e75"
overlay1 = "#e7fc7c"
text = "#c1efd5"
subtext0 = "#627e75"
red = "#ffa9d2"
green = "#96e497"
yellow = "#e7fc7c"
blue = "#abe7ca"
teal = "#8ee4b2"
mauve = "#c3c8ff"
peach = "#f9c55c"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    { token = "state_icon", fg = "#1c2020" },
    { token = "workspace", bold = true, fg = "#1c2020" },
  ],
  [
    { token = "branch", fg = "#59623c" },
    { token = "git_status", fg = "#59623c" },
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#1c2020" },
  ],
  [
    { token = "workspace", bold = false, dim = false, fg = "#59623c" },
  ],
  [
    { token = "state_icon", fg = "#1c2020" },
    { token = "state_text", fg = "#1c2020" },
    { token = "agent", fg = "#59623c" },
  ],
]
# END BLACK ATOM LIVERY THEME

[update]
channel = "preview"

[ui.toast]
delivery = "herdr"

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = false
sidebar_max_width = 45
sidebar_collapsed_mode = "hidden"
pane_borders = "always"
pane_scrollbars = false

tab_bar_right = [
  # { type = "zoom" },
  { type = "hostname" },
  { type = "datetime", format = "%H:%M" },
  # { type = "text", text = "prod" },
  # { type = "command", command = "~/.config/herdr/status.sh", interval_seconds = 5, timeout_seconds = 2 },
]
tab_bar_right_separator = " | "

status_indicators = "symbols"
[ui.sound]
enabled = false
done_path = "./sounds/277033__headphaze__ui-completed-status-alert-notification-sfx001.mp3"
request_path = "./sounds/337050__shinephoenixstormcrow__215415__unfa__ping_modified.mp3"

[session]
resume_agents_on_restore = true

[experimental]
pane_history = true
kitty_graphics = true

switch_ascii_input_source_in_prefix = true
[keys]
prefix = "ctrl+,"

# General
open_notification_target = "prefix+,"
copy_mode = "alt+esc"
toggle_sidebar = "cmd+s"

# Tabs
switch_tab = "alt+1..9"
rename_tab = "alt+n"
new_tab = "alt+t"
previous_tab = "alt+h"
next_tab = "alt+l"
close_tab = "alt+q"
move_tab_previous = "alt+shift+h"
move_tab_next = "alt+shift+l"

# Workspaces
switch_workspace = "alt+shift+1..9"
previous_workspace = "alt+k"
next_workspace = "alt+j"
new_workspace = "alt+shift+t"
close_workspace = "alt+shift+q"
rename_workspace = "alt+shift+n"

# Worktrees
new_worktree = "alt+ctrl+t"
open_worktree = "alt+ctrl+o"
remove_worktree = "alt+ctrl+d"

# Agents
focus_agent = "ctrl+alt+1..9"
previous_agent = "alt+ctrl+k"
next_agent = "alt+ctrl+j"

# Panes
close_pane = "alt+x"
last_pane = "alt+o"
zoom = "alt+z"

# Navigation
navigate_workspace_up = "k"
navigate_workspace_down = "j"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-nvim-nav.left"
description = "navigate left (nvim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-nvim-nav.down"
description = "navigate down (nvim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-nvim-nav.up"
description = "navigate up (nvim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-nvim-nav.right"
description = "navigate right (nvim/herdr)"

