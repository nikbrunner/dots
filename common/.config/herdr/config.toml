onboarding = false
# https://github.com/ogulcancelik/herdr
# https://herdr.dev/docs/configuration/
# https://herdr.dev/docs/config-reference/
# https://herdr.dev/plugins/

# BEGIN BLACK ATOM LIVERY THEME
# Black Atom — Stations ∷ Operations
# Generated by Black Atom Industries — https://github.com/black-atom-industries/herdr
[theme.custom]
accent = "#b7db6e"
panel_bg = "#192323"
sidebar_bg = "#192323"
active_row_bg = "#293c36"
selection_bg = "#354e46"
surface_dim = "#192323"
surface0 = "#293c36"
surface1 = "#293c36"
overlay0 = "#91bcad"
overlay1 = "#75a490"
text = "#c1efd5"
subtext0 = "#91bcad"
red = "#f08cb4"
green = "#80c980"
yellow = "#b7db6e"
blue = "#abe7ca"
teal = "#75d69e"
mauve = "#b6bee0"
peach = "#e9b565"


[ui.sidebar.spaces]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true, fg = "#b7db6e" },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    { token = "$parent", bold = true, dim = false, fg = "#b7db6e" },
  ],
  [
    { token = "workspace", bold = false, dim = true },
  ],
  [
    "state_icon",
    "state_text",
    "agent",
  ],
]
# END BLACK ATOM LIVERY THEME

[update]
channel = "preview"

[ui.toast]
delivery = "herdr"

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = false
sidebar_max_width = 45

tab_bar_right = [
  # { type = "zoom" },
  { type = "hostname" },
  { type = "datetime", format = "%H:%M" },
  # { type = "text", text = "prod" },
  # { type = "command", command = "~/.config/herdr/status.sh", interval_seconds = 5, timeout_seconds = 2 },
]
tab_bar_right_separator = " | "

[ui.sound]
enabled = true
done_path = "./sounds/i_love_the_smell_of_the_bomb.mp3"
request_path = "./sounds/i_cant_build_there.mp3"

[session]
resume_agents_on_restore = true

[experimental]
pane_history = true
kitty_graphics = true

switch_ascii_input_source_in_prefix = true
[keys]
prefix = "ctrl+,"

switch_tab = "alt+1..9"
switch_workspace = "alt+shift+1..9"
focus_agent = "ctrl+alt+1..9"

copy_mode = "alt+esc"

open_notification_target = "prefix+,"

close_pane = "alt+x"
last_pane = "alt+o"

rename_tab = "alt+n"
new_tab = "alt+t"
previous_tab = "alt+h"
next_tab = "alt+l"
close_tab = "alt+q"
move_tab_previous = "alt+shift+h"
move_tab_next = "alt+shift+l"

previous_workspace = "alt+k"
next_workspace = "alt+j"
new_workspace = "alt+shift+t"
close_workspace = "alt+shift+q"
rename_workspace = "alt+shift+n"

new_worktree = "alt+ctrl+t"
open_worktree = "alt+ctrl+o"
remove_worktree = "alt+ctrl+d"

previous_agent = "alt+ctrl+k"
next_agent = "alt+ctrl+j"

zoom = "alt+z"

navigate_workspace_up = "k"
navigate_workspace_down = "j"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-nvim-nav.left"
description = "navigate left (nvim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-nvim-nav.down"
description = "navigate down (nvim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-nvim-nav.up"
description = "navigate up (nvim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-nvim-nav.right"
description = "navigate right (nvim/herdr)"

[[keys.command]]
key = "alt+shift+f"
type = "pane"
command = "pick-font"
description = "Pick a font"

[[keys.command]]
key = "alt+shift+p"
type = "pane"
command = "herdr-file-picker -g"
description = "Pick a file"

[[keys.command]]
key = "alt+shift+g"
type = "pane"
command = "lazygit"
description = "Open LazyGit"

[[keys.command]]
key = "alt+shift+d"
type = "pane"
command = "lazydocker"
description = "Open LazyDocker"

[[keys.command]]
key = "alt+shift+j"
type = "pane"
command = "lazyjira"
description = "Open LazyJira"

[[keys.command]]
key = "alt+shift+r"
type = "pane"
command = "tuicr -w"
description = "Open Tuicr"

[[keys.command]]
key = "ctrl+shift+t"
type = "pane"
command = "tuxedo"
description = "Open Tasks"

[[keys.command]]
key = "alt+s"
type = "plugin_action"
command = "helm-herdr.open"
description = "jump to anything"

[[keys.command]]
key = "alt+shift+o"
type = "plugin_action"
command = "helm-herdr.jump-back"
description = "jump to previous workspace"

[[keys.command]]
key = "cmd+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
